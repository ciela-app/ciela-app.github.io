<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Returning to Ciela…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #faf7f2;
      color: #2a2620;
      font-family: -apple-system, "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    .mark {
      width: 52px; height: 52px;
      border-radius: 12px;
      background: linear-gradient(135deg, #56708a 0%, #2f435a 50%, #16203a 100%);
      margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: #2a2620;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #8a8275;
      line-height: 1.6;
      max-width: 320px;
    }
    .error { color: #92400e; }
  </style>
</head>
<body>
  <div class="mark">
    <svg width="28" height="28" viewBox="0 0 512 512" aria-hidden="true">
      <defs>
        <mask id="c">
          <rect width="512" height="512" fill="black"/>
          <circle cx="256" cy="256" r="160" fill="white"/>
          <circle cx="312" cy="240" r="160" fill="black"/>
        </mask>
      </defs>
      <rect width="512" height="512" fill="transparent"/>
      <rect width="512" height="512" fill="#f5efe4" mask="url(#c)"/>
    </svg>
  </div>

  <h1 id="heading">Returning to Ciela…</h1>
  <p id="msg">Finishing sign-in. This tab will close on its own.</p>

  <script>
    var p = new URLSearchParams(window.location.search);
    var code  = p.get("code");
    var state = p.get("state");
    var error = p.get("error");

    if (error) {
      document.getElementById("heading").textContent = "Sign-in cancelled.";
      document.getElementById("msg").textContent = "You can close this tab and try again in Ciela.";
      document.getElementById("msg").className = "error";
      window.location.href = "ciela://oauth-callback?error=" + encodeURIComponent(error);
    } else if (code && state) {
      window.location.href =
        "ciela://oauth-callback?code=" + encodeURIComponent(code) +
        "&state=" + encodeURIComponent(state);
    } else {
      // Direct navigation — no OAuth params present.
      document.getElementById("heading").textContent = "Nothing to do here.";
      document.getElementById("msg").textContent =
        "This page is part of Ciela’s sign-in flow. If you arrived here by accident, you can close this tab.";
    }
  </script>
</body>
</html>
